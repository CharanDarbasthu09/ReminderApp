name: Build Real Physical iPhone 16 IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --no-install

      - name: Bundle React Native Code
        run: |
          mkdir -p ios/ReminderApp
          npx react-native bundle --platform ios --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output ios/ReminderApp/main.jsbundle --assets-dest ios/ReminderApp || true

      - name: Configure Podfile for Unsigned Physical Build
        run: |
          cat << 'EOF' >> ios/Podfile

post_install do |installer|
  installer.pods_project.targets.each do |target|
    target.build_configurations.each do |config|
      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
      config.build_settings['CODE_SIGN_IDENTITY'] = ''
      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
    end
  end
end
EOF

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update

      - name: Build Physical iPhone ARM64 Binary
        run: |
          cd ios
          xcodebuild -workspace ReminderApp.xcworkspace \
                     -scheme ReminderApp \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     IPHONEOS_DEPLOYMENT_TARGET=16.0 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r ../ReminderApp-ARM64-iPhone16.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReminderApp-ARM64-iPhone16.ipa
          path: ReminderApp-ARM64-iPhone16.ipa
