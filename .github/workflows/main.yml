name: Build Real Physical iPhone 16 IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --no-install

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update

      - name: Build Physical iPhone ARM64 Binary
        run: |
          cd ios
          xcodebuild -workspace ReminderApp.xcworkspace \
                     -scheme ReminderApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     DEVELOPMENT_TEAM="" \
                     ONLY_ACTIVE_ARCH=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build || {
                       echo "=== XCODEBUILD ERROR LOGS ==="
                       cat build/Logs/Build/*.xcactivitylog 2>/dev/null | strings | grep -i "error:" | head -n 30
                       exit 1
                     }

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r ../ReminderApp-ARM64-iPhone16.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReminderApp-ARM64-iPhone16.ipa
          path: ReminderApp-ARM64-iPhone16.ipa
